name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tải mã nguồn whisper.cpp
        run: git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cài NDK và CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/app-release.apk GhiChuCuocGoi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GhiChuCuocGoi-apk
          path: GhiChuCuocGoi.apk

      - name: Đăng bản tải về (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Ghi chú cuộc gọi (bản mới nhất)
          prerelease: false
          make_latest: true
          body: "Bản build số ${{ github.run_number }}. Tải file GhiChuCuocGoi.apk về điện thoại để cài."
          files: GhiChuCuocGoi.apk
